<!DOCTYPE html>
<html>
<head>
  <title>Batch QR Code Generator</title>
  <!-- Load QR Code and ZIP Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <!-- Google 3D Model Viewer Web Component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

  <style>
    /* Center all page content */
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }

    /* Style headings */
    h2 {
      font-size: 1.25rem;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    /* Uniform input and button styling */
    input[type="text"], input[type="number"], input[type="file"] {
      padding: 8px 12px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 5px;
    }

    button:hover {
      background-color: #0056b3;
    }

    /* Centered 3D Container */
    .model-container {
      width: 100%;
      max-width: 300px;
      margin: 0 auto 25px auto;
    }

    model-viewer {
      width: 100%;
      height: 250px;
      background-color: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    /* Footer styling */
    .footer {
      margin-top: 40px;
      color: #777;
      font-size: 0.9rem;
    }

    .note {
      font-size: 0.85rem;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- Interactive 3D Model Box -->
  <div class="model-container">
    <model-viewer 
      src="johndeere.glb" 
      alt="3D Model" 
      camera-controls 
      auto-rotate 
      shadow-intensity="1">
    </model-viewer>
  </div>

  <!-- Batch Section -->
  <h2>QR Creator:<br> 
    Please upload a text/CSV file with URLs on individual lines.<br> 
    Then download the zip file of QR pngs.</h2>
  <div>
    <input type="file" id="fileInput" accept=".txt,.csv"><br>
    <p class="note">Format per line: <code>https://example.com</code> or <code>https://example.com, 101</code></p>
    <button onclick="processFile()">Generate & Download ZIP</button>
  </div>

  <hr style="margin: 35px 0; border: 0; border-top: 1px solid #eee;">

  <!-- Single URL Section -->
  <h2>Single QR Creator:<br>
    Type in the URL and optional ID, then download the QR code PNG</h2>
  <div>
    <input type="text" id="singleUrlInput" placeholder="https://example.com" style="width: 250px;">
    <input type="text" id="singleIdInput" placeholder="ID / Number (e.g. 101)" style="width: 150px;">
    <br>
    <button onclick="generateSingleQr()">Download QR Code</button>
  </div>

  <p class="footer">tallbridgeguy2026</p>

  <!-- Hidden temporary div for rendering QR codes -->
  <div id="qrcode-temp" style="display:none;"></div>

  <script>
    // Helper function to append ?ID= directly to the URL
    function appendIdToUrl(urlString, id) {
      if (!id) return urlString;

      let formattedUrl = urlString;
      // Ensure the URL starts with a protocol so browser link handling remains valid
      if (!/^https?:\/\//i.test(formattedUrl)) {
        formattedUrl = 'https://' + formattedUrl;
      }

      // Appends ?ID= directly to the URL string
      return `${formattedUrl}?ID=${encodeURIComponent(id)}`;
    }

    // Process multiple URLs from a file
    async function processFile() {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files.length) return alert('Please select a file!');
      
      const file = fileInput.files[0];
      const text = await file.text();
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');

      const zip = new JSZip();
      const tempDiv = document.getElementById('qrcode-temp');

      for (let i = 0; i < lines.length; i++) {
        tempDiv.innerHTML = '';
        const rawLine = lines[i].trim();
        
        // Split line by comma or tab (e.g., "url, id")
        const parts = rawLine.split(/,|\t/).map(p => p.trim());
        let baseUrl = parts[0];
        let idVal = parts[1] || '';

        // Generate target URL formatted as: https://example.com?ID=number
        const finalUrl = appendIdToUrl(baseUrl, idVal);

        // Name file based on ID if available, otherwise index number
        const fileName = idVal ? `qrcode_${idVal}.png` : `qrcode_${i + 1}.png`;

        // Generate high-res QR Code (1000x1000)
        new QRCode(tempDiv, {
          text: finalUrl,
          width: 1000,
          height: 1000
        });

        // Pause for rendering
        await new Promise(r => setTimeout(r, 50));
        
        const img = tempDiv.querySelector('img') || tempDiv.querySelector('canvas');
        let dataUrl = img.tagName === 'CANVAS' ? img.toDataURL('image/png') : img.src;
        let base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");

        // Add to ZIP archive
        zip.file(fileName, base64Data, {base64: true});
      }

      // Generate and download ZIP
      zip.generateAsync({type:"blob"}).then(function(content) {
        saveAs(content, "qr_codes.zip");
      });
    }

    // Process a single URL from text input
    async function generateSingleQr() {
      const urlInput = document.getElementById('singleUrlInput');
      const idInput = document.getElementById('singleIdInput');
      
      const url = urlInput.value.trim();
      const idVal = idInput.value.trim();

      if (!url) return alert('Please enter a URL!');

      const finalUrl = appendIdToUrl(url, idVal);
      const tempDiv = document.getElementById('qrcode-temp');
      tempDiv.innerHTML = '';

      // Generate high-res QR Code (1000x1000)
      new QRCode(tempDiv, {
        text: finalUrl,
        width: 1000,
        height: 1000
      });

      // Pause for rendering
      await new Promise(r => setTimeout(r, 50));

      const img = tempDiv.querySelector('img') || tempDiv.querySelector('canvas');
      let dataUrl = img.tagName === 'CANVAS' ? img.toDataURL('image/png') : img.src;

      const fileName = idVal ? `qrcode_${idVal}.png` : 'qrcode.png';

      // Trigger file download
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
